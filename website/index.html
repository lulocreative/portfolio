<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Director's Cut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: a single-screen editing suite. Program monitor + inspector on top, multi-track timeline below.
   Page scroll drives the playhead; overlays (project, lightbox, bin, about) sit above the suite. */
:root{
  --bg:#0D0E10; --panel:#15171A; --panel-2:#1C1F23; --line:#2A2E34; --line-2:#383D44;
  --fg:#E9E7E2; --muted:#8C929B; --dim:#5E646D;
  --play:#F0B43C;              /* playhead / tally */
  --ph:#2A2D32; --ph-2:#34383E; --ph-ink:#6F7680;  /* placeholder greys */
  --t-dir:#8E7CC3; --t-film:#5FA8A0; --t-digital:#6E93C9; --t-craft:#C98A6E; --t-photo:#A9B061; --t-audio:#3E9C76;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --labelW:136px; --topH:52px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--bg)}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
:focus-visible{outline:2px solid var(--play); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}

/* ---------- top bar ---------- */
.topbar{position:fixed; inset:0 0 auto; z-index:40; height:calc(var(--topH) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:16px; background:var(--bg); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.logo-mark{height:30px; width:auto; display:block; flex:none}
.intro-lockup{display:block; height:clamp(54px,9vw,120px); width:auto; max-width:100%; margin:0 0 clamp(14px,2vw,26px)}
.brand b{font-family:var(--f-display); font-weight:700; font-stretch:112%; font-size:15px; letter-spacing:.02em; white-space:nowrap}
.brand span{color:var(--muted); font-size:12px; white-space:nowrap}
.top-tc{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--fg)}
.rec{width:8px; height:8px; border-radius:50%; background:var(--play)}
.nav{display:flex; gap:4px}
.nav button{padding:6px 12px; border:1px solid var(--line); border-radius:4px; font-size:13px; background:var(--panel)}
.nav button:hover{border-color:var(--line-2); background:var(--panel-2)}
.wf-badge{position:fixed; z-index:41; right:max(12px, env(safe-area-inset-right,0px)); bottom:calc(8px + env(safe-area-inset-bottom,0px));
  font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); pointer-events:none}

/* ---------- scroll space + sticky stage ---------- */
#scrollspace{position:relative}
.stage{position:sticky; top:0; height:100vh; height:100dvh; padding-top:calc(var(--topH) + env(safe-area-inset-top,0px));
  display:grid; grid-template-rows:minmax(0,1fr) auto}
.suite{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:1px; background:var(--line); min-height:0; border-bottom:1px solid var(--line)}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; height:34px; padding:0 14px; border-bottom:1px solid var(--line); flex:none}
.monitor{background:var(--panel); display:flex; flex-direction:column; min-height:0; min-width:0}
.screen-wrap{flex:1; min-height:0; display:grid; place-items:center; padding:14px 20px; background:#0A0B0C}
.screen{position:relative; width:100%; max-width:100%; aspect-ratio:16/9; max-height:100%; background:var(--ph); overflow:hidden; cursor:default}
.screen.openable{cursor:zoom-in}
@supports (aspect-ratio:1){ .screen{height:auto} }
.screen canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.ov{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(12px,2.4vw,28px); pointer-events:none}
.ov > *{pointer-events:auto}
.ov-top{display:flex; justify-content:space-between; gap:12px; font-size:11px; color:var(--ph-ink)}
.ov-mid{align-self:flex-start; max-width:28ch}
.ov-title{font-family:var(--f-display); font-weight:750; font-stretch:118%; font-size:clamp(28px,5.6vw,76px); line-height:.92; letter-spacing:-.01em; text-wrap:balance; margin:0}
.ov-sub{font-size:clamp(14px,1.5vw,19px); color:#C9C6BF; margin:.6em 0 0; max-width:34ch; text-wrap:balance}
.ov-bottom{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.chip-btn{display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:var(--fg); color:var(--bg); font-weight:600; font-size:13px}
.chip-btn.ghost{background:transparent; color:var(--fg); border:1px solid var(--line-2)}
.hint{font-size:11px; color:var(--muted)}
.hint .arrow{display:inline-block; animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.transport{display:flex; align-items:center; justify-content:center; gap:6px; height:42px; border-top:1px solid var(--line); flex:none}
.transport button{width:34px; height:28px; display:grid; place-items:center; border-radius:4px; color:var(--muted)}
.transport button:hover{color:var(--fg); background:var(--panel-2)}
.transport button.on{color:var(--play)}
.transport .sep{width:1px; height:16px; background:var(--line); margin:0 6px}
.transport .keys{font-size:10px; color:var(--dim); margin-left:10px}

.inspector{background:var(--panel); display:flex; flex-direction:column; min-height:0; min-width:0}
.insp-body{padding:18px 16px; display:flex; flex-direction:column; gap:16px; overflow:auto; min-height:0}
.insp-num{font-family:var(--f-mono); font-size:12px; color:var(--play)}
.insp-title{font-family:var(--f-display); font-weight:700; font-stretch:110%; font-size:24px; line-height:1.05; margin:4px 0 0; text-wrap:balance}
.insp-line{color:#C9C6BF; margin:0}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; font-size:13px}
.kv dt{color:var(--muted); font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding-top:2px}
.kv dd{margin:0}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border:1px solid var(--line-2); border-radius:3px; font-size:12px}
.tag i{width:8px; height:8px; border-radius:2px; display:block}
.insp-open{align-self:flex-start}

/* ---------- timeline ---------- */
.timeline{background:var(--panel); display:flex; flex-direction:column; user-select:none}
.tl-head{display:flex; align-items:center; gap:14px; height:32px; padding:0 14px; border-bottom:1px solid var(--line)}
.tl-head .seq{font-size:12px}
.tl-head .tc{color:var(--play); font-size:13px}
.tl-head .zoom{margin-left:auto; font-size:11px; color:var(--dim)}
.tl-body{display:grid; grid-template-columns:var(--labelW) minmax(0,1fr); position:relative}
.labels{border-right:1px solid var(--line); background:var(--panel)}
.labels .ruler-pad{height:26px; border-bottom:1px solid var(--line)}
.lab{height:26px; display:flex; align-items:center; gap:8px; padding:0 10px; font-size:11px; color:var(--muted); border-bottom:1px solid #1E2125; white-space:nowrap; overflow:hidden}
.lab b{font-family:var(--f-mono); font-weight:500; color:var(--fg); font-size:10px; width:22px}
.lab i{width:6px; height:14px; border-radius:1px; flex:none}
.lanes{position:relative; overflow:hidden}
.lanes-inner{position:relative; width:100%; will-change:transform}
.ruler{position:relative; height:26px; border-bottom:1px solid var(--line); background:linear-gradient(var(--panel),var(--panel))}
.tick{position:absolute; bottom:0; width:1px; height:6px; background:var(--line-2)}
.tick.major{height:11px; background:var(--dim)}
.tick-l{position:absolute; top:3px; font-family:var(--f-mono); font-size:9.5px; color:var(--dim); transform:translateX(3px); white-space:nowrap}
.marker{position:absolute; top:2px; transform:translateX(-50%); font-size:10px; color:var(--play); white-space:nowrap; font-family:var(--f-mono)}
.lane{position:relative; height:26px; border-bottom:1px solid #1E2125}
.lane:nth-child(even){background:rgba(255,255,255,.012)}
.clip{position:absolute; top:3px; bottom:3px; border-radius:3px; padding:0 7px; display:flex; align-items:center; gap:6px;
  font-size:11px; font-weight:600; color:#101113; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  border:1px solid rgba(0,0,0,.35); opacity:.62; transition:opacity .2s, filter .2s}
.clip:hover{opacity:.9}
.clip.active{opacity:1; box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.clip .fx{position:absolute; top:0; left:0; right:0; height:3px; background:rgba(0,0,0,.25)}
.clip span{position:relative; overflow:hidden; text-overflow:ellipsis}
.wave{position:absolute; inset:3px 0; width:100%; height:20px}
.playhead{position:absolute; top:0; bottom:0; width:0; z-index:5; pointer-events:none}
.playhead::before{content:""; position:absolute; top:0; bottom:0; left:-.5px; width:1px; background:var(--play)}
.playhead::after{content:""; position:absolute; top:0; left:-6px; border:6px solid transparent; border-top:9px solid var(--play)}

/* ---------- project view ---------- */
.view{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; overscroll-behavior:contain}
.view-bar{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; height:calc(var(--topH) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  background:var(--bg); border-bottom:1px solid var(--line)}
.crumb{font-size:12px; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.crumb b{color:var(--fg); font-weight:500}
.close{margin-left:auto; display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--line); border-radius:4px; font-size:13px; flex:none}
.close:hover{background:var(--panel-2)}
.close kbd{font-family:var(--f-mono); font-size:10px; color:var(--dim)}
.wrap{max-width:1240px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.v-hero{aspect-ratio:16/9; max-height:78vh; width:100%; background:var(--ph); position:relative; display:grid; place-items:center; color:var(--ph-ink); cursor:zoom-in}
.ph-x{position:absolute; inset:0; background:
  linear-gradient(to top right, transparent calc(50% - .5px), var(--ph-2) calc(50% - .5px), var(--ph-2) calc(50% + .5px), transparent calc(50% + .5px)),
  linear-gradient(to top left, transparent calc(50% - .5px), var(--ph-2) calc(50% - .5px), var(--ph-2) calc(50% + .5px), transparent calc(50% + .5px))}
.ph-label{position:relative; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; text-align:center; padding:6px 10px; background:var(--ph)}
.play-ico{position:relative; width:56px; height:56px; border-radius:50%; border:1px solid var(--ph-ink); display:grid; place-items:center; margin:0 auto 10px}
.v-head{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:32px; padding-block:40px 28px; align-items:end}
.v-title{font-family:var(--f-display); font-weight:750; font-stretch:118%; font-size:clamp(36px,6vw,84px); line-height:.92; margin:8px 0 0; text-wrap:balance}
.v-line{font-size:clamp(17px,1.6vw,21px); color:#C9C6BF; margin:0; max-width:40ch; text-wrap:balance}
.facts{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-block:1px solid var(--line)}
.facts div{padding:14px 16px 14px 0; display:flex; flex-direction:column; gap:4px; min-width:0}
.facts div + div{padding-left:16px; border-left:1px solid var(--line)}
.facts dd{margin:0; font-size:14px}
.ledmade{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); margin-block:40px}
.ledmade > div{background:var(--panel); padding:22px}
.ledmade h3{margin:0 0 12px; font-family:var(--f-display); font-stretch:112%; font-size:20px}
.ledmade ul{margin:0; padding:0; list-style:none; display:grid; gap:8px}
.ledmade li{display:flex; gap:10px}
.ledmade li::before{content:""; width:8px; height:8px; margin-top:7px; border-radius:2px; background:var(--c,var(--muted)); flex:none}
.story{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px; margin-bottom:48px}
.story h4{margin:0 0 8px}
.story p{margin:0; color:#C9C6BF; max-width:42ch}
.todo{color:var(--dim); font-style:italic}
.media{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; margin-bottom:56px}
.m{position:relative; background:var(--ph); display:grid; place-items:center; color:var(--ph-ink); cursor:zoom-in; overflow:hidden; min-width:0}
.m:hover .ph-label{color:var(--fg)}
.m.w6{grid-column:span 6; aspect-ratio:21/9} .m.w4{grid-column:span 4; aspect-ratio:16/9} .m.w2{grid-column:span 2; aspect-ratio:9/16}
.m.w3{grid-column:span 3; aspect-ratio:4/3} .m.w2s{grid-column:span 2; aspect-ratio:1/1}
.next{display:block; width:100%; text-align:left; border-top:1px solid var(--line); padding-block:36px 72px}
.next .v-title{font-size:clamp(32px,5vw,64px); color:var(--muted); transition:color .2s}
.next:hover .v-title{color:var(--fg)}
.ghost{position:fixed; z-index:59; background:var(--ph); pointer-events:none}
.ov-title,.ov-sub{text-shadow:0 2px 20px rgba(0,0,0,.6)}
.screen.real .ov{background:linear-gradient(90deg, rgba(10,11,12,.82), rgba(10,11,12,.35) 45%, transparent 70%)}
.screen.real .ov-top{color:#C9C6BF}
.v-hero{overflow:hidden}
.v-hero img.bg{position:absolute; inset:-40px; width:calc(100% + 80px); height:calc(100% + 80px); object-fit:cover; filter:blur(30px) brightness(.5)}
.v-hero img.fg{position:relative; max-width:90%; max-height:90%; height:90%; width:auto; object-fit:contain; box-shadow:0 24px 70px rgba(0,0,0,.5)}
.media{align-items:start}
.m.real{background:var(--panel)}
.m.real img.cover{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.m .cap{position:absolute; left:8px; bottom:8px; font-size:10.5px; padding:3px 7px; background:rgba(13,14,16,.8); color:var(--fg); border-radius:3px; opacity:0; transition:opacity .2s}
.m:hover .cap,.m:focus-visible .cap{opacity:1}
.lb-item.real{background:transparent}
.lb-item.real img{width:100%; height:100%; object-fit:contain; display:block}

/* ---------- lightbox ---------- */
.lightbox{position:fixed; inset:0; z-index:80; background:rgba(6,7,8,.96); display:grid; grid-template-rows:auto minmax(0,1fr) auto; touch-action:pan-y}
.lb-top{display:flex; align-items:center; gap:12px; height:52px; padding-top:env(safe-area-inset-top,0px); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.lb-stage{display:grid; place-items:center; padding:8px max(16px, env(safe-area-inset-left,0px)); min-height:0}
.lb-item{background:var(--ph); position:relative; display:grid; place-items:center; color:var(--ph-ink); max-width:100%; max-height:100%; width:min(100%, calc((100dvh - 140px) * var(--ar)))}
.lb-nav{display:flex; justify-content:center; gap:10px; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lb-nav button{width:44px; height:36px; border:1px solid var(--line-2); border-radius:4px; display:grid; place-items:center}
.lb-nav button:hover{background:var(--panel-2)}

/* ---------- bin + about drawers ---------- */
.drawer{position:fixed; inset:0; z-index:70; display:flex}
.scrim{position:absolute; inset:0; background:rgba(0,0,0,.55)}
.drawer-panel{position:relative; width:min(560px,100%); height:100%; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); animation:slide .28s cubic-bezier(.2,.7,.2,1)}
.drawer.wide .drawer-panel{width:min(1100px,100%)}
@keyframes slide{from{transform:translateX(-24px); opacity:0}}
.drawer-body{overflow:auto; min-height:0; flex:1}
.bin-table{width:100%; border-collapse:collapse; font-size:13px}
.bin-table th{position:sticky; top:0; background:var(--panel-2); text-align:left; font-weight:500; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 12px; border-bottom:1px solid var(--line)}
.bin-table td{padding:9px 12px; border-bottom:1px solid #1E2125; white-space:nowrap}
.bin-table tr.folder td{color:var(--muted); font-size:12px; background:rgba(255,255,255,.015)}
.bin-table tr.item{cursor:pointer}
.bin-table tr.item:hover td{background:var(--panel-2)}
.bin-table tr.item:hover td:first-child{box-shadow:inset 2px 0 var(--play)}
.sw{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:8px}
.about-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:32px; padding:28px max(16px, env(safe-area-inset-left,0px)) 12px}
.about-grid h2{font-family:var(--f-display); font-stretch:118%; font-weight:750; font-size:clamp(30px,4vw,48px); line-height:.95; margin:6px 0 14px; text-wrap:balance}
.about-grid p{color:#C9C6BF; margin:0 0 10px; max-width:58ch}
.caps{display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; margin-top:6px}
.caps h4{margin:0 0 4px; font-size:13px}
.caps p{font-size:13px; margin:0}
.career{padding:8px max(16px, env(safe-area-inset-left,0px)) 24px}
.career-scroll{overflow-x:auto; border:1px solid var(--line); background:var(--bg)}
.career-inner{min-width:860px; position:relative; display:grid; grid-template-columns:150px 1fr}
.c-lane{position:relative; height:34px; border-bottom:1px solid #1E2125}
.c-lab{height:34px; display:flex; align-items:center; padding:0 10px; font-size:11px; color:var(--muted); border-bottom:1px solid #1E2125; border-right:1px solid var(--line)}
.c-ruler{position:relative; height:26px; border-bottom:1px solid var(--line)}
.c-clip{position:absolute; top:5px; bottom:5px; border-radius:3px; font-size:11px; font-weight:600; color:#101113; padding:0 6px; display:flex; align-items:center; overflow:hidden; white-space:nowrap; cursor:default; opacity:.8}
.c-clip:hover,.c-clip:focus{opacity:1; outline:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.c-tip{position:absolute; z-index:3; background:var(--fg); color:var(--bg); padding:8px 10px; border-radius:4px; font-size:12px; line-height:1.35; max-width:240px; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.4)}
.contact{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:4px max(16px, env(safe-area-inset-left,0px)) 32px}
.contact .addr{font-family:var(--f-mono); font-size:14px; user-select:all; padding:8px 12px; border:1px solid var(--line-2); border-radius:4px}

/* ---------- mobile ---------- */
@media (max-width:820px){
  :root{--labelW:0px}
  .brand span{display:none}
  .top-tc{font-size:12px}
  .nav button{padding:6px 9px; font-size:12px}
  .suite{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr)}
  .monitor .panel-head, .transport .keys, .tl-head .zoom{display:none}
  .screen-wrap{padding:0; flex:none}
  .insp-body{padding:14px 16px; gap:10px}
  .insp-title{font-size:21px}
  .kv{display:none}
  .labels{display:none}
  .tl-body{grid-template-columns:minmax(0,1fr)}
  .lane,.ruler{height:22px} .clip{font-size:10px}
  .facts{grid-template-columns:1fr 1fr}
  .facts div{padding-left:0 !important; border-left:0 !important; border-top:1px solid var(--line)}
  .facts div:nth-child(-n+2){border-top:0}
  .v-head,.ledmade,.story,.about-grid,.caps{grid-template-columns:minmax(0,1fr)}
  .v-head{gap:14px; padding-block:24px 20px}
  .media{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m.w6,.m.w4{grid-column:span 2; aspect-ratio:16/9} .m.w3{grid-column:span 2} .m.w2,.m.w2s{grid-column:span 1}
}

<script>

let acc = 0;
SEGS.forEach((s,i) => { s.start = acc; acc += s.dur; s.i = i; });
const TOTAL = acc;
const PROJECTS = SEGS.filter(s => s.kind === 'project' || s.kind === 'photo');
PROJECTS.forEach((p,i) => p.n = String(i+1).padStart(2,'0'));

const fmtTC = sec => {
  const f = Math.floor((sec % 1) * 25), s = Math.floor(sec);

/* ---------- build timeline ---------- */
const labels = $('#labels'), laneWrap = $('#laneWrap'), ruler = $('#ruler'), lanesInner = $('#lanesInner'), lanes = $('#lanes'), playhead = $('#playhead');
TRACKS.forEach(t => {

});

for (let s = 0; s <= TOTAL; s += 2) {
  const major = s % 8 === 0;
  ruler.insertAdjacentHTML('beforeend', `<i class="tick${major?' major':''}" style="left:${pct(s)}"></i>` + (major && s < TOTAL ? `<span class="tick-l" style="left:${pct(s)}">${fmtTC(s).slice(3,8)}</span>` : ''));
}
const clipEls = [];
SEGS.forEach(seg => {

// audio waveform across the whole sequence (generated)
(() => {
  const lane = laneWrap.querySelector('[data-track="audio"]');

  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { const h = 2 + Math.abs(Math.sin(i/9)) * 6 + rnd() * 5; d += `M${i} ${10-h}V${10+h}`; }

const space = $('#scrollspace');

const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);

function jumpTo(i){

const IMG = {};

SEGS.forEach(s => (s.imgs || []).forEach(getImg));
function drawImgs(seg, t, w, h){
  // real content: the clip steps through its images as you scroll, each with a scroll-driven push-in

function draw(seg, t){
  const w = cv.width / (cv.width / screen.clientWidth || 1), h = screen.clientHeight;

  const fr = $('#fr'); if (fr) fr.textContent = `FRAME ${String(Math.floor(t*seg.dur*25)).padStart(4,'0')} / ${String(seg.dur*25).padStart(4,'0')}`;
  const it = $('#introT'); if (it) { const o = t < .55 ? 1 : Math.max(.15, 1 - (t-.55)/.45); it.style.opacity = o; it.style.transform = `translateY(${(1-o)*-16}px)`; }
  draw(seg, t);
}
const req = () => { if (!rafPending) { rafPending = true; requestAnimationFrame(frame); } };
addEventListener('scroll', req, {passive:true});
addEventListener('resize', () => { fitScreen(); curSeg = -1; req(); });
new ResizeObserver(() => { fitScreen(); req(); }).observe(screen.parentElement);

/* ---------- play / transport ---------- */
let playing = false, lastT = 0;
function step(ts){
  if (!playing) return;
  const dt = lastT ? (ts - lastT) / 1000 : 0; lastT = ts;
  const pxPerSec = maxScroll() / TOTAL;
  scrollTo(0, scrollY + pxPerSec * dt);
  if (scrollY >= maxScroll() - 1) return stopPlay();
  requestAnimationFrame(step);
}
function startPlay(){ if (reduce) { jumpTo(Math.min(SEGS.length-1, curSeg+1)); return; } playing = true; lastT = 0; $('#tPlay').classList.add('on'); $('#icPlay').innerHTML = '<path d="M4 2h3v12H4zM9 2h3v12H9z"/>'; requestAnimationFrame(step); }
function stopPlay(){ playing = false; $('#tPlay').classList.remove('on'); $('#icPlay').innerHTML = '<path d="M4 2l10 6-10 6z"/>'; }
$('#tPlay').onclick = () => playing ? stopPlay() : startPlay();
$('#tPrev').onclick = () => { const sec = secFromScroll(), s = segAt(sec); jumpTo(sec - s.start > 1.2 ? s.i : Math.max(0, s.i - 1)); };
$('#tNext').onclick = () => jumpTo(Math.min(SEGS.length - 1, curSeg + 1));
$('#tOpen').onclick = () => { const s = SEGS[curSeg]; if (PROJECTS.includes(s)) openProject(s.id, true); };
['wheel','touchstart'].forEach(ev => addEventListener(ev, () => playing && stopPlay(), {passive:true}));

/* ---------- overlays: shared ---------- */
const anyOpen = () => !$('#view').hidden || !$('#lb').hidden || !$('#bin').hidden || !$('#about').hidden;
const lock = () => { document.documentElement.style.overflow = anyOpen() ? 'hidden' : ''; };

  [['w2','Portrait',9/16],['w2s','Product',1],['w3','Editorial',4/3],['w3','Landscape',4/3],['w2s','Detail',1]][i%5].concat(false));
let openedInternally = false, curProject = null, lbItems = [], lbIdx = 0;

function ph(label, video){ return `<i class="ph-x"></i><div class="ph-label">${video ? '<div class="play-ico">▶</div>' : ''}${label}</div>`; }

const heroImg = m => `<img class="bg" src="${m[4]}" alt=""><img class="fg" src="${m[4]}" alt="${m[1]}">`;
function renderProject(p){

  view.innerHTML = `
    <div class="view-bar"><button type="button" class="close" data-back style="margin-left:0">← Timeline</button>
      <span class="crumb">Director's Cut / <b>Clip ${p.n}</b> · ${p.title}</span>
      <button type="button" class="close" data-back>Close <kbd>ESC</kbd></button></div>
    <div class="v-hero" data-lb="0" id="vHero">${p.hero ? heroImg(p.hero) : ph(isPhoto ? 'Opening image' : 'Hero film / image · placeholder', !isPhoto)}</div>
    <div class="wrap">
      <div class="v-head">
        <div><div class="insp-num">CLIP ${p.n} / ${String(PROJECTS.length).padStart(2,'0')}</div><h1 class="v-title" id="vTitle">${p.title}</h1></div>
        <p class="v-line">${p.line}</p>
      </div>
      <dl class="facts">
        <div><dt class="eyebrow">Client</dt><dd>${p.client}</dd></div>
        <div><dt class="eyebrow">Year</dt><dd>${p.year}</dd></div>
        <div><dt class="eyebrow">Role</dt><dd>${p.role}</dd></div>
        <div><dt class="eyebrow">Markets</dt><dd>${p.markets}</dd></div>
        <div><dt class="eyebrow">Scale</dt><dd>${p.scale}</dd></div>
      </dl>
      ${isPhoto ? '' : `
      <div class="ledmade">

        <div><p class="eyebrow" style="margin:0 0 6px">Hands-on</p><h3>Made</h3><ul>${p.made.map(x => `<li style="--c:var(--play)">${x}</li>`).join('')}</ul></div>
      </div>
      <div class="story">${p.story ? p.story.map(s => `<div><h4>${s[0]}</h4><p>${s[1]}</p></div>`).join('') : `
        <div><h4>Challenge</h4><p class="todo">1–2 sentences: the problem we had to solve.</p></div>
        <div><h4>Idea</h4><p class="todo">1–2 sentences: the core concept.</p></div>
        <div><h4>Result</h4><p class="todo">Numbers if possible: reach, sales, engagement, awards.</p></div>`}
      </div>`}
      ${isPhoto ? '<div style="height:32px"></div>' : ''}
      <div class="media">${media.map((m,i) => `<button type="button" class="m ${m[0]}${m[4] ? ' real' : ''}" data-lb="${i+1}" aria-label="Open ${m[1]} full screen"${m[4] ? ` style="aspect-ratio:${m[2]}"` : ''}>${cell(m)}</button>`).join('')}</div>
      <button type="button" class="next" data-next="${next.id}"><span class="eyebrow">Next clip · ${next.n}</span><div class="v-title">${next.title} →</div></button>

  view.scrollTop = 0;
}
function openProject(id, internal){
  const p = PROJECTS.find(x => x.id === id); if (!p) return;
  stopPlay();
  if (internal) { openedInternally = true; if (location.hash !== '#' + id) { location.hash = id; return; } }
  showProject(p);
}
function showProject(p){
  const wasOpen = !view.hidden;
  curProject = p; renderProject(p);
  closeDrawers();
  if (!wasOpen && !reduce) {
    // expand from the program monitor into the project hero
    const r = screen.getBoundingClientRect();
    const g = document.createElement('div'); g.className = 'ghost';
    Object.assign(g.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'});
    document.body.appendChild(g);
    const top = $('.topbar').offsetHeight, h = Math.min(innerWidth * 9/16, innerHeight * .78);
    g.animate([{left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'},
               {left:'0px', top:top+'px', width:innerWidth+'px', height:h+'px'}], {duration:420, easing:'cubic-bezier(.2,.7,.2,1)', fill:'forwards'})
      .onfinish = () => { view.hidden = false; lock(); view.animate([{opacity:.0},{opacity:1}], {duration:180}); setTimeout(() => g.remove(), 60); view.querySelector('[data-back]').focus({preventScroll:true}); };
  } else { view.hidden = false; lock(); view.querySelector('[data-back]').focus({preventScroll:true}); }
}
function closeProject(){
  if (openedInternally) { openedInternally = false; history.back(); }
  else { location.hash = 'cut'; }
}
function hideProject(){ if (view.hidden) return; view.hidden = true; curProject = null; lock(); }
view.addEventListener('click', e => {
  if (e.target.closest('[data-back]')) return closeProject();
  const n = e.target.closest('[data-next]'); if (n) { location.replace('#' + n.dataset.next); return; }
  const l = e.target.closest('[data-lb]'); if (l) openLb(+l.dataset.lb);
});

/* ---------- lightbox ---------- */
const lb = $('#lb');
function renderLb(){
  const m = lbItems[lbIdx];
  $('#lbStage').innerHTML = m[4]
    ? `<div class="lb-item real" style="--ar:${m[2]}; aspect-ratio:${m[2]}"><img src="${m[4]}" alt="${m[1]}"></div>`
    : `<div class="lb-item" style="--ar:${m[2]}; aspect-ratio:${m[2]}">${ph(m[1], m[3])}</div>`;
  $('#lbCount').textContent = `${lbIdx+1} / ${lbItems.length}`; $('#lbCap').textContent = m[1];
}
function openLb(i){ lbIdx = i; renderLb(); lb.hidden = false; lock(); $('#lbClose').focus(); }
function closeLb(){ lb.hidden = true; lock(); }
const lbGo = d => { lbIdx = (lbIdx + d + lbItems.length) % lbItems.length; renderLb(); };
$('#lbPrev').onclick = () => lbGo(-1); $('#lbNext').onclick = () => lbGo(1); $('#lbClose').onclick = closeLb;
let sx = null;
lb.addEventListener('pointerdown', e => { sx = e.clientX; });
lb.addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) lbGo(dx < 0 ? 1 : -1); });

/* ---------- bin ---------- */
const FOLDERS = [
  ['Featured cut', PROJECTS.map(p => p.id)],
  ['Campaigns', ['summer-campaign']], ['Film', ['shot-and-cut','summer-campaign']], ['Digital · UX/UI', ['digital-australia','kids-app']],
  ['Brand', ['rebrand','brand-from-zero']], ['Illustration & Animation', ['kids-app']], ['Photography', ['photography']]

  FOLDERS.map(([f, ids]) => `<tr class="folder"><td colspan="4">▾ ▢ ${f}</td></tr>` + ids.map(id => {

  }).join('')).join('') +
  `<tr class="folder"><td colspan="4">▸ ▢ Archive 2006–2016 <span style="color:var(--dim)">(compact grid, coming later)</span></td></tr></tbody>`;
const bin = $('#bin');
$('#binTable').addEventListener('click', e => { const r = e.target.closest('tr.item'); if (r) openProject(r.dataset.id, true); });
$('#binTable').addEventListener('keydown', e => { const r = e.target.closest('tr.item'); if (r && e.key === 'Enter') openProject(r.dataset.id, true); });
function openBin(){ stopPlay(); closeDrawers(); bin.hidden = false; lock(); bin.querySelector('.close').focus(); }

  ['ds',2006,2010,'Digital Designer','Agencies in Sydney, Melbourne & Wellington','Microsoft, Honda, Heineken, Westfield and more'],

  ['ux',2016,2017.2,'UBT Global','Digital Creative Director · Sydney','UX leadership for complex platforms'],

  ['cd',2021.1,2026.9,'NutraQ / VitaeLab','Creative Director · Oslo','Brand, campaigns, TV, digital, social']
];
const AWARDS = [[2010.88,'IAB ×2'],[2010.95,'ACHAP Grand Prix'],[2011.38,'McCann best of region'],[2011.6,'AMAUTA Gold + Silver']];
const Y0 = 2006, Y1 = 2027, yp = y => ((y - Y0) / (Y1 - Y0) * 100) + '%';
$('#aboutBody').innerHTML = `
  <div class="about-grid">
    <div><p class="eyebrow">Placeholder bio</p><h2>18 years. Four countries. Every medium.</h2>
      <p>Creative Director with experience across in-house, agency and freelance roles in Norway, Australia, Chile and New Zealand. Builds creative platforms and leads integrated work across TV, digital and social, and still makes the work by hand.</p>

      <div style="position:relative">

const career = $('#career'); let tip = null;
const showTip = el => { hideTip(); tip = document.createElement('div'); tip.className = 'c-tip'; tip.innerHTML = el.dataset.tip; career.appendChild(tip);
  const cr = career.getBoundingClientRect(), r = el.getBoundingClientRect();

career.addEventListener('mouseover', e => { const c = e.target.closest('.c-clip'); if (c) showTip(c); });
career.addEventListener('mouseout', e => { if (e.target.closest('.c-clip')) hideTip(); });
career.addEventListener('focusin', e => { const c = e.target.closest('.c-clip'); if (c) showTip(c); });

$('#copyBtn').onclick = () => {
  const b = $('#copyBtn');

  try { navigator.clipboard.writeText('lulokoba@gmail.com').then(done, () => selAddr()); } catch(_) { selAddr(); }
};
function selAddr(){ const r = document.createRange(); r.selectNodeContents($('#addr')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
const about = $('#about');
function openAbout(toContact){ stopPlay(); closeDrawers(); about.hidden = false; lock(); about.querySelector('.close').focus({preventScroll:true});
  const body = $('#aboutBody'); if (toContact) setTimeout(() => body.scrollTo({top: $('#contactSec').offsetTop - 20, behavior: reduce?'auto':'smooth'}), 60); else body.scrollTop = 0; }

document.querySelectorAll('.drawer [data-close]').forEach(b => b.addEventListener('click', closeDrawers));
$('#btnWork').onclick = openBin; $('#btnAbout').onclick = () => openAbout(false); $('#btnContact').onclick = () => openAbout(true);

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'Escape') {
    if (!lb.hidden) return closeLb();
    if (!view.hidden) return closeProject();
    if (!bin.hidden || !about.hidden) return closeDrawers();
  }
  if (!lb.hidden) { if (e.key === 'ArrowRight') lbGo(1); if (e.key === 'ArrowLeft') lbGo(-1); return; }
  if (anyOpen()) return;
  const k = e.key.toLowerCase();
  if (k === 'l') { e.preventDefault(); $('#tNext').click(); }
  else if (k === 'j') { e.preventDefault(); $('#tPrev').click(); }
  else if (k === 'k' || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); $('#tPlay').click(); }
  else if (e.key === 'Enter' && (e.target === document.body)) { $('#tOpen').click(); }
});

/* ---------- hash routing: each project has its own link ---------- */
function route(){
  const id = location.hash.slice(1);
  const p = PROJECTS.find(x => x.id === id);
  if (p) {
    showProject(p);
    // keep the timeline in sync with the opened project
    const s = SEGS[p.i]; if (segAt(secFromScroll()).i !== s.i) scrollTo(0, scrollFromSec(s.start + s.dur * .3));
  } else { closeLb(); hideProject(); }
}
addEventListener('hashchange', route);

fitScreen(); frame(); route();
})();
</script>
