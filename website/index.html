<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Director's Cut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,700..900,0..100,0..1;1,9..144,700..900,0..100,0..1&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: a single-screen editing suite. Program monitor + inspector on top, multi-track timeline below.
   Page scroll drives the playhead; overlays (project, lightbox, bin, about) sit above the suite. */
:root{
  --bg:#060F1F; --panel:#0B1729; --panel-2:#112036; --line:#1A2B45; --line-2:#243858;
  --fg:#F2EEE5; --muted:#9AA8BF; --dim:#66758E;
  --play:#F0B43C;              /* playhead / tally */
  --ph:#2A2D32; --ph-2:#34383E; --ph-ink:#6F7680;  /* placeholder greys */
  --t-dir:#8E7CC3; --t-film:#5FA8A0; --t-digital:#6E93C9; --t-craft:#C98A6E; --t-photo:#A9B061; --t-audio:#3E9C76;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-retro:"Fraunces", "Cooper Black", Georgia, serif;
  --retro-ink:#F5DE4E; --retro-shadow:#C8401F;
  --cta:#E80687; --cta-hover:#C9056F;   /* primary call to action */
  --f-head:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;   /* headings: clean app-style sans */
  --labelW:136px; --topH:52px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--bg)}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
:focus-visible{outline:2px solid var(--play); outline-offset:2px}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums; letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}

/* ---------- top bar ---------- */
.topbar{position:fixed; inset:0 0 auto; z-index:40; height:calc(var(--topH) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex; align-items:center; gap:16px; background:var(--bg); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.logo-mark{height:30px; width:auto; display:block; flex:none}
.intro-lockup{display:block; height:clamp(54px,9vw,120px); width:auto; max-width:100%; margin:0 0 clamp(14px,2vw,26px)}
.brand b{font-family:var(--f-display); font-weight:700; font-stretch:112%; font-size:15px; letter-spacing:.02em; white-space:nowrap}
.brand span{color:var(--muted); font-size:12px; white-space:nowrap}
.top-tc{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--fg)}
.rec{width:8px; height:8px; border-radius:50%; background:var(--play)}
.nav{display:flex; gap:4px}
.nav button{padding:6px 12px; border:1px solid var(--line); border-radius:4px; font-size:13px; background:var(--panel)}
.nav button:hover{border-color:var(--line-2); background:var(--panel-2)}
.wf-badge{position:fixed; z-index:41; right:max(12px, env(safe-area-inset-right,0px)); bottom:calc(8px + env(safe-area-inset-bottom,0px));
  font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); pointer-events:none}

/* ---------- scroll space + sticky stage ---------- */
#scrollspace{position:relative}
.stage{position:fixed; top:0; right:0; bottom:0; left:0; padding-top:calc(var(--topH) + env(safe-area-inset-top,0px));
  display:grid; grid-template-rows:minmax(0,1fr) auto}
.suite{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:1px; background:var(--line); min-height:0; border-bottom:1px solid var(--line)}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; height:34px; padding:0 14px; border-bottom:1px solid var(--line); flex:none}
.monitor{background:var(--panel); display:flex; flex-direction:column; min-height:0; min-width:0}
.screen-wrap{flex:1; min-height:0; display:grid; place-items:center; padding:14px 20px; background:#040B17}
.screen{position:relative; width:100%; max-width:100%; aspect-ratio:16/9; max-height:100%; background:var(--ph); overflow:hidden; cursor:default}
.screen.openable{cursor:zoom-in}
@supports (aspect-ratio:1){ .screen{height:auto} }
.screen canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.ov{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(12px,2.4vw,28px); pointer-events:none}
.ov > *{pointer-events:auto}
.ov-top{display:flex; justify-content:space-between; gap:12px; font-size:11px; color:var(--ph-ink)}
.ov-mid{align-self:flex-start; max-width:58cqw}
.ov-mid .ov-sub{max-width:34ch}
.ov-title{font-family:var(--f-display); font-weight:750; font-stretch:118%; font-size:clamp(28px,5.6vw,76px); line-height:.92; letter-spacing:-.01em; text-wrap:balance; margin:0}
.ov-sub{font-size:clamp(14px,1.5vw,19px); color:#C9C6BF; margin:.6em 0 0; max-width:34ch; text-wrap:balance}
.ov-bottom{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.chip-btn{display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:var(--cta); color:#fff; font-weight:600; font-size:13px; transition:background .15s}
.chip-btn:not(.ghost):hover{background:var(--cta-hover)}
.chip-btn.ghost{background:transparent; color:var(--fg); border:1px solid var(--line-2)}
.hint{font-size:11px; color:var(--muted)}
.hint .arrow{display:inline-block; animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.transport{display:flex; align-items:center; justify-content:center; gap:6px; height:42px; border-top:1px solid var(--line); flex:none}
.transport button{width:34px; height:28px; display:grid; place-items:center; border-radius:4px; color:var(--muted)}
.transport button:hover{color:var(--fg); background:var(--panel-2)}
.transport button.on{color:var(--play)}
.transport .sep{width:1px; height:16px; background:var(--line); margin:0 6px}
.transport .keys{font-size:10px; color:var(--dim); margin-left:10px}

.inspector{background:var(--panel); display:flex; flex-direction:column; min-height:0; min-width:0}
.insp-body{padding:18px 16px; display:flex; flex-direction:column; gap:16px; overflow:auto; min-height:0}
.insp-num{font-family:var(--f-mono); font-size:12px; color:var(--play)}
.insp-title{font-family:var(--f-display); font-weight:700; font-stretch:110%; font-size:24px; line-height:1.05; margin:4px 0 0; text-wrap:balance}
.insp-line{color:#C9C6BF; margin:0}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0; font-size:13px}
.kv dt{color:var(--muted); font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding-top:2px}
.kv dd{margin:0}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border:1px solid var(--line-2); border-radius:3px; font-size:12px}
.tag i{width:8px; height:8px; border-radius:2px; display:block}
.insp-open{align-self:flex-start}

/* ---------- timeline ---------- */
.timeline{background:var(--panel); display:flex; flex-direction:column; user-select:none}
.tl-head{display:flex; align-items:center; gap:14px; height:32px; padding:0 14px; border-bottom:1px solid var(--line)}
.tl-head .seq{font-size:12px}
.tl-head .tc{color:var(--play); font-size:13px}
.tl-head .zoom{margin-left:auto; font-size:11px; color:var(--dim)}
.tl-body{display:grid; grid-template-columns:var(--labelW) minmax(0,1fr); position:relative}
.labels{border-right:1px solid var(--line); background:var(--panel)}
.labels .ruler-pad{height:26px; border-bottom:1px solid var(--line)}
.lab{height:26px; display:flex; align-items:center; gap:8px; padding:0 10px; font-size:11px; color:var(--muted); border-bottom:1px solid #14243D; white-space:nowrap; overflow:hidden}
.lab b{font-family:var(--f-mono); font-weight:500; color:var(--fg); font-size:10px; width:22px}
.lab i{width:6px; height:14px; border-radius:1px; flex:none}
.lanes{position:relative; overflow:hidden}
.lanes-inner{position:relative; width:100%; will-change:transform}
.ruler{position:relative; height:26px; border-bottom:1px solid var(--line); background:linear-gradient(var(--panel),var(--panel))}
.tick{position:absolute; bottom:0; width:1px; height:6px; background:var(--line-2)}
.tick.major{height:11px; background:var(--dim)}
.tick-l{position:absolute; top:3px; font-family:var(--f-mono); font-size:9.5px; color:var(--dim); transform:translateX(3px); white-space:nowrap}
.marker{position:absolute; top:2px; transform:translateX(-50%); font-size:10px; color:var(--play); white-space:nowrap; font-family:var(--f-mono)}
.lane{position:relative; height:26px; border-bottom:1px solid #14243D}
.lane:nth-child(even){background:rgba(255,255,255,.012)}
.clip{position:absolute; top:3px; bottom:3px; border-radius:3px; padding:0 7px; display:flex; align-items:center; gap:6px;
  font-size:11px; font-weight:600; color:#101113; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  border:1px solid rgba(0,0,0,.35); opacity:.62; transition:opacity .2s, filter .2s}
.clip:hover{opacity:.9}
.clip.active{opacity:1; box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.clip .fx{position:absolute; top:0; left:0; right:0; height:3px; background:rgba(0,0,0,.25)}
.clip span{position:relative; overflow:hidden; text-overflow:ellipsis}
.wave{position:absolute; inset:3px 0; width:100%; height:20px}
.lanes{cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none}
.lanes.dragging{cursor:grabbing}
.lockup-row{display:flex; align-items:center; gap:clamp(12px,2vw,22px); margin:0 0 clamp(10px,2vw,26px)}
.lockup-row .intro-lockup{margin:0}
.scroll-cue{display:flex; flex-direction:column; align-items:center; gap:6px; font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#C9C6BF}
.scroll-cue .mouse{width:20px; height:32px; border:1.5px solid #ECE9E2; border-radius:11px; position:relative}
.scroll-cue .mouse::after{content:""; position:absolute; left:50%; top:6px; width:3px; height:7px; margin-left:-1.5px; border-radius:2px; background:var(--play); animation:cue 1.6s cubic-bezier(.6,0,.4,1) infinite}
.ov > .scroll-cue{position:absolute; right:clamp(16px,3vw,36px); top:50%; transform:translateY(-50%)}
.intro-name{margin:0 0 clamp(8px,1.4vw,16px); font-family:var(--f-mono); font-size:clamp(10px,1vw,12px); letter-spacing:.14em; text-transform:uppercase; color:#F3E3DE}
.screen{container-type:size}
/* intro composed around the portrait: face sits left of centre, title lives in the open purple space on the right */
/* desktop opening screen: monitor takes the full width, inspector slides in when the projects begin */
@media (min-width:821px){
  .suite{transition:grid-template-columns .6s cubic-bezier(.2,.7,.2,1), gap .6s}
  .inspector{transition:opacity .4s .1s, transform .6s cubic-bezier(.2,.7,.2,1)}
  .inspector .panel-head,.inspector .insp-body{min-width:300px}
  .stage.intro-wide .suite{grid-template-columns:minmax(0,1fr) 0px; gap:0}
  .stage.intro-wide .inspector{opacity:0; transform:translateX(30px); pointer-events:none; transition:opacity .25s, transform .6s cubic-bezier(.2,.7,.2,1)}
  .screen{transition:width .6s cubic-bezier(.2,.7,.2,1), height .6s cubic-bezier(.2,.7,.2,1), border-radius .6s}
}
/* intro: a silent showreel loop of the featured films plays behind a centred title card */
.reel{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s; background:#000}
.screen.intro .reel{opacity:1}
.screen.intro .ov{background:radial-gradient(ellipse at center, rgba(6,15,31,.35), rgba(6,15,31,.72) 80%)}
.sr-only{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.intro-card{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:min(2.2cqw,3.8cqh); padding:6cqh 8cqw}
.intro-pre{margin:0; font-family:var(--f-retro); font-weight:800; font-style:italic; font-size:max(10px, min(1.7cqw, 3cqh)); letter-spacing:.04em; color:var(--retro-ink); text-shadow:.08em .08em 0 var(--retro-shadow)}
.intro-title{margin:0; font-family:var(--f-retro); font-weight:900; font-variation-settings:"SOFT" 100, "WONK" 1, "opsz" 144; font-size:min(7.2cqw, 13cqh); line-height:.92; letter-spacing:-.005em; color:var(--retro-ink); text-shadow:.05em .05em 0 var(--retro-shadow)}
.intro-card .scroll-cue{color:#F3EBD3; font-size:max(9px, min(1cqw, 1.8cqh)); margin-top:min(1cqw,2cqh)}
.intro-skip{position:absolute; left:3cqw; bottom:4.5cqh; border:1px solid var(--cta)}
.intro-cta{border:1px solid var(--cta); margin-top:min(1.2cqw,2.2cqh)}
/* desktop clip layout, after a streaming-service hero: bottom-left title, meta row, description, two buttons; discipline badges bottom-right */
.ov-meta,.ov-actions{display:none}
@media (min-width:821px){
  .screen.openable .ov{justify-content:flex-end; padding:3.6cqw 4cqw; background:linear-gradient(to top, rgba(6,10,20,.88), rgba(6,10,20,.25) 45%, transparent 65%), linear-gradient(90deg, rgba(6,10,20,.65), transparent 58%)}
  .screen.openable .ov-top{position:absolute; top:3cqw; left:4cqw; right:4cqw}
  .screen.openable .ov-mid{max-width:56cqw}
  .ov-meta{display:flex; flex-wrap:wrap; align-items:center; gap:.35em .55em; margin:.9em 0 0; font-size:max(12px,1.3cqw); font-weight:600; color:#fff}
  .ov-meta i{font-style:normal; color:rgba(255,255,255,.5)}
  .screen.openable .ov-sub{margin:.55em 0 0; font-size:max(14px,1.65cqw); line-height:1.4; color:#fff; max-width:40ch}
  .ov-actions{display:flex; gap:max(8px,.9cqw); margin-top:36px}
  .ov-actions .chip-btn,.ov-btn2{height:max(38px,4.3cqw); padding:0 max(16px,2.2cqw); font-size:max(13px,1.55cqw); font-weight:600; border-radius:999px; margin:0}
  .ov-actions .chip-btn svg{width:.95em; height:.95em}
  .ov-btn2{display:inline-flex; align-items:center; gap:8px; color:#fff; background:rgba(120,120,128,.5); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
  .ov-btn2:hover{background:rgba(140,140,148,.62)}
  .ov-badges{position:absolute; right:4cqw; bottom:3.6cqw; display:flex; gap:max(6px,.7cqw)}
  .ov-badge{display:inline-flex; align-items:center; gap:7px; padding:max(5px,.55cqw) max(9px,1cqw); border-radius:8px; background:rgba(16,18,24,.62); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); font-size:max(11px,1.1cqw); font-weight:600; color:#fff}
  .ov-badge i{width:8px; height:8px; border-radius:2px; display:block}
}
@keyframes cue{0%{transform:translateY(0);opacity:1}70%{transform:translateY(11px);opacity:0}100%{transform:translateY(0);opacity:0}}
.playhead{position:absolute; top:0; bottom:0; width:0; z-index:5; pointer-events:none}
.playhead::before{content:""; position:absolute; top:0; bottom:0; left:-.5px; width:1px; background:var(--play)}
.playhead::after{content:""; position:absolute; top:0; left:-6px; border:6px solid transparent; border-top:9px solid var(--play)}

/* ---------- project view ---------- */
.view{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; overscroll-behavior:contain}
.view-bar{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; height:calc(var(--topH) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  background:var(--bg); border-bottom:1px solid var(--line)}
.crumb{font-size:12px; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.crumb b{color:var(--fg); font-weight:500}
.close{margin-left:auto; display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--line); border-radius:4px; font-size:13px; flex:none}
.close:hover{background:var(--panel-2)}
.close kbd{font-family:var(--f-mono); font-size:10px; color:var(--dim)}
.wrap{max-width:1240px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.v-hero{aspect-ratio:16/9; max-height:78vh; width:100%; background:var(--ph); position:relative; display:grid; place-items:center; color:var(--ph-ink); cursor:zoom-in}
.ph-x{position:absolute; inset:0; background:
  linear-gradient(to top right, transparent calc(50% - .5px), var(--ph-2) calc(50% - .5px), var(--ph-2) calc(50% + .5px), transparent calc(50% + .5px)),
  linear-gradient(to top left, transparent calc(50% - .5px), var(--ph-2) calc(50% - .5px), var(--ph-2) calc(50% + .5px), transparent calc(50% + .5px))}
.ph-label{position:relative; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; text-align:center; padding:6px 10px; background:var(--ph)}
.play-ico{position:relative; width:56px; height:56px; border-radius:50%; border:1px solid var(--ph-ink); display:grid; place-items:center; margin:0 auto 10px}
.v-head{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:32px; padding-block:40px 28px; align-items:end}
.v-title{font-family:var(--f-display); font-weight:750; font-stretch:118%; font-size:clamp(36px,6vw,84px); line-height:.92; margin:8px 0 0; text-wrap:balance}
.v-line{font-size:clamp(17px,1.6vw,21px); color:#C9C6BF; margin:0; max-width:40ch; text-wrap:balance}
.facts{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border-block:1px solid var(--line)}
.facts div{padding:14px 16px 14px 0; display:flex; flex-direction:column; gap:4px; min-width:0}
.facts div + div{padding-left:16px; border-left:1px solid var(--line)}
.facts dd{margin:0; font-size:14px}
.ledmade{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); margin-block:40px}
.ledmade > div{background:var(--panel); padding:22px}
.ledmade h3{margin:0 0 12px; font-family:var(--f-display); font-stretch:112%; font-size:20px}
.ledmade ul{margin:0; padding:0; list-style:none; display:grid; gap:8px}
.ledmade li{display:flex; gap:10px}
.ledmade li::before{content:""; width:8px; height:8px; margin-top:7px; border-radius:2px; background:var(--c,var(--muted)); flex:none}
.story{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px; margin-bottom:48px}
.story h4{margin:0 0 8px}
.story p{margin:0; color:#C9C6BF; max-width:42ch}
.todo{color:var(--dim); font-style:italic}
.media{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; margin-bottom:56px}
.m{position:relative; background:var(--ph); display:grid; place-items:center; color:var(--ph-ink); cursor:zoom-in; overflow:hidden; min-width:0}
.m:hover .ph-label{color:var(--fg)}
.m.w6{grid-column:span 6; aspect-ratio:21/9} .m.w4{grid-column:span 4; aspect-ratio:16/9} .m.w2{grid-column:span 2; aspect-ratio:9/16}
.m.w3{grid-column:span 3; aspect-ratio:4/3} .m.w2s{grid-column:span 2; aspect-ratio:1/1}
.next{display:block; width:100%; text-align:left; border-top:1px solid var(--line); padding-block:36px 72px}
.next .v-title{font-size:clamp(32px,5vw,64px); color:var(--muted); transition:color .2s}
.next:hover .v-title{color:var(--fg)}
.flip-ghost{position:fixed; z-index:59; background:var(--ph); pointer-events:none}
.ov-title,.ov-sub{text-shadow:0 2px 20px rgba(0,0,0,.6)}
/* every clip title uses the same retro title-card type as the first screen */
.ov-title{font-family:var(--f-retro); font-weight:900; font-stretch:normal; font-variation-settings:"SOFT" 100, "WONK" 1, "opsz" 144; letter-spacing:-.005em; line-height:.92; color:var(--retro-ink); text-shadow:.05em .05em 0 var(--retro-shadow)}
.arr{width:.9em; height:.9em; flex:none; display:inline-block; vertical-align:-.1em}

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);

const TRACKS = [
  {id:'dir',     code:'V3', name:'Direction & Brand',  c:'var(--t-dir)'},
  {id:'film',    code:'V2', name:'Film & Animation',   c:'var(--t-film)'},
  {id:'design',  code:'V1', name:'Design & Image',     c:'var(--t-digital)'},
  {id:'audio',   code:'A1', name:'Showreel score',       c:'var(--t-audio)'}
];
const TC = Object.fromEntries(TRACKS.map(t => [t.id, t]));

const SEGS = [
  {id:'intro', kind:'intro', dur:8, title:'Opening titles', tracks:['dir']},
  {id:'summer-campaign', kind:'project', dur:12, title:'VitaePro Summer Campaign 2026', client:'VitaePro (NutraQ)', year:'2026', role:'Creative Director', markets:'5 markets',

           ['w3','The sock squad',16/9,false,'media/vitaepro/still-03.jpg'],['w3','Gathering round',16/9,false,'media/vitaepro/still-04.jpg'],['w3','One more stretch',16/9,false,'media/vitaepro/still-06.jpg'],
           ['w3','Back to the room',16/9,false,'media/vitaepro/still-07.jpg'],['w6','Pack shot',16/9,false,'media/vitaepro/still-08.jpg']],
    led:['Campaign concept and creative platform','Large-scale production across 2 shoot days','Rollout for 5 markets and every channel','Alignment with marketing and market leads'],
    made:['Storyboards','On-set direction','Final craft reviews']},
  {id:'hanna-maria-greece', kind:'project', dur:12, title:'Hanna-Maria in Greece', client:'VitaePro (NutraQ)', year:'2024', role:'Director · DOP · Editor · Photographer', markets:'Finland',
    scale:'30s TV ad · shot on location in Greece', line:'A swimming world champion on TV. I filmed, edited and photographed it myself.', tracks:['film','dir'],
    led:['Concept and script','On-location direction with the talent'], made:['Filming, on land and underwater','Editing','Colour grade','Photoshoot'],
    seq:true, imgs:Array.from({length:48}, (_, i) => `media/hanna-maria/seq/f${String(i + 1).padStart(3, '0')}.jpg`), gif:'media/hanna-maria/hanna-maria-greece.gif',
    hero:['hero','TV ad · 30s (Finland)',16/9,true,'media/hanna-maria/poster.jpg','video/hanna-maria-greece-2024.mp4'],
    media:[['w6','Butterfly',16/9,false,'media/hanna-maria/still-04.jpg'],['w3','On the beach',16/9,false,'media/hanna-maria/still-01.jpg'],['w3','Close-up',16/9,false,'media/hanna-maria/still-06.jpg'],
           ['w3','Swim cap on',16/9,false,'media/hanna-maria/still-02.jpg'],['w3','Underwater',16/9,false,'media/hanna-maria/still-03.jpg'],['w3','Group training',16/9,false,'media/hanna-maria/still-05.jpg'],
           ['w3','In the pool',16/9,false,'media/hanna-maria/still-07.jpg'],['w6','Pack shot',16/9,false,'media/hanna-maria/still-08.jpg']],
    photos:[['w6','Butterfly',1.5,false,'media/hanna-maria/photos/01-butterfly.jpg'],['w3','Beach portrait',1.5,false,'media/hanna-maria/photos/02-beach-portrait.jpg'],['w3','Beach stretch',1.5,false,'media/hanna-maria/photos/03-beach-lunge.jpg'],
            ['w3','On the shore',1.5,false,'media/hanna-maria/photos/04-beach-kneel.jpg'],['w3','Kayak',1.773,false,'media/hanna-maria/photos/05-kayak.jpg'],['w6','Underwater',1.773,false,'media/hanna-maria/photos/06-underwater.jpg'],
            ['w3','Training court',1.5,false,'media/hanna-maria/photos/07-training-court.jpg'],['w3','Workout',1.443,false,'media/hanna-maria/photos/08-workout.jpg'],
            ['w3','Product in hand',1.5,false,'media/hanna-maria/photos/09-product-hand.jpg'],['w3','Product still life',1.5,false,'media/hanna-maria/photos/10-product-bag.jpg']]},
  {id:'kids-app', kind:'project', dur:12, title:'Yummo Adventures', client:'Cenovis · Pusher, Sydney', year:'2012', role:'Digital Art Director', markets:'Australia',
    scale:'Tablet storybook app · 4 games', line:'A Word document in. A whole world out.', tracks:['film','design'],
    led:['The creative idea: turning a script into an app world','Concepts for all four games'],
    made:['Character design','Illustration of every character and world','Storyboards','Animation of the stories and characters'],
    imgs:['kids/04-game-super-charge.jpg','kids/05-game-wipe-out.jpg','kids/06-game-get-netted.jpg','kids/07-game-bed-head.jpg'],
    hero:['hero','Yummo world on iPad',0.814,false,'kids/02-yummo-world-ipad.jpg'],
    story:[['Challenge',"34% of Australian kids don't eat their recommended daily fruit and vegetables. Cenovis wanted to teach kids and parents about good nutrition in a fun, positive way."],
           ['Idea',"Yummo Adventures: a tablet storybook app where Sammy and Sally learn about the “good stuff” in fruit and vegetables, through animated stories and four games."],
           ['What I delivered',"The brief was a Word document with the story and dialogue. I created everything else: characters, storyboards, animated stories and four original games."]],
    media:[['w2','Home screen on iPad',0.636,false,'kids/01-intro-title-ipad.jpg'],['w2','Character sheet',0.69,false,'kids/08-game-characters.jpg'],['w2','Storybook scenes',0.461,false,'kids/03-story-scenes-grid.jpg'],
           ['w3','Game · Super Charge',1.405,false,'kids/04-game-super-charge.jpg'],['w3','Game · Wipe Out',1.339,false,'kids/05-game-wipe-out.jpg'],
           ['w3','Game · Get Netted',1.412,false,'kids/06-game-get-netted.jpg'],['w3','Game · Bed Head',1.412,false,'kids/07-game-bed-head.jpg'],
           ['w6','Sammy and Sally',2.4,false,'kids/09-sammy-and-sally.jpg']]},
  {id:'digital-australia', kind:'project', dur:12, title:'Digital Channels, Australia', client:'TBC', year:'2016–2018', role:'Digital Creative Director', markets:'Australia',
    scale:'Apps, landing pages, social', line:'Digital creative direction across apps, web and social.', tracks:['design','dir'],
    led:['Team across UX, UI and motion','Digital channel strategy'], made:['UX flows','UI design','Prototypes']},
  {id:'rebrand', kind:'project', dur:12, title:'Rebrand', client:'TBC', year:'TBC', role:'Creative Director', markets:'TBC',
    scale:'Identity system, rollout', line:'A brand rebuilt from strategy to every touchpoint.', tracks:['dir','design'],
    led:['Brand strategy and idea','Identity system'], made:['Art direction','Key visuals']},
  {id:'brand-from-zero', kind:'project', dur:12, title:'Brand & Product', client:'TBC', year:'TBC', role:'Creative Director', markets:'TBC',
    scale:'Name, identity, packaging, launch', line:'A brand and product built from zero.', tracks:['dir','design'],
    led:['Brand creation','Launch campaign'], made:['Product photography','Packaging design']},
  {id:'photography', kind:'photo', dur:10, title:'Photography', client:'Personal + professional', year:'Various', role:'Photographer', markets:'—',
    scale:'Editorial, product, portrait', line:"Personal editorial for T‑Michael, featured on Vogue's Instagram.", tracks:['design'], marker:'◆ Vogue feature'},
  {id:'end', kind:'end', dur:6, title:"That's a wrap", tracks:['dir']}
];
let acc = 0;
SEGS.forEach((s,i) => { s.start = acc; acc += s.dur; s.i = i; });
const TOTAL = acc;
const PROJECTS = SEGS.filter(s => s.kind === 'project' || s.kind === 'photo');
PROJECTS.forEach((p,i) => p.n = String(i+1).padStart(2,'0'));

const fmtTC = sec => {
  const f = Math.floor((sec % 1) * 25), s = Math.floor(sec);
  const p = n => String(n).padStart(2,'0');
  return `${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}:${p(f)}`;
};

/* ---------- build timeline ---------- */
const labels = $('#labels'), laneWrap = $('#laneWrap'), ruler = $('#ruler'), lanesInner = $('#lanesInner'), lanes = $('#lanes'), playhead = $('#playhead');
TRACKS.forEach(t => {
  labels.insertAdjacentHTML('beforeend', `<div class="lab"><b>${t.code}</b><i style="background:${t.c}"></i>${t.name}</div>`);
  const lane = document.createElement('div'); lane.className = 'lane'; lane.dataset.track = t.id; laneWrap.appendChild(lane);
});
const pct = s => (s / TOTAL * 100) + '%';
for (let s = 0; s <= TOTAL; s += 2) {
  const major = s % 8 === 0;
  ruler.insertAdjacentHTML('beforeend', `<i class="tick${major?' major':''}" style="left:${pct(s)}"></i>` + (major && s < TOTAL ? `<span class="tick-l" style="left:${pct(s)}">${fmtTC(s).slice(3,8)}</span>` : ''));
}
const clipEls = [];
SEGS.forEach(seg => {
  if (seg.marker) ruler.insertAdjacentHTML('beforeend', `<span class="marker" style="left:${pct(seg.start + seg.dur/2)}">${seg.marker}</span>`);
  seg.tracks.forEach((tid, k) => {
    const lane = laneWrap.querySelector(`[data-track="${tid}"]`);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'clip';
    b.style.left = `calc(${pct(seg.start)} + 1px)`; b.style.width = `calc(${pct(seg.dur)} - 2px)`;
    b.style.background = TC[tid].c;
    const label = seg.kind === 'intro' ? 'Title · Opening' : seg.kind === 'end' ? 'End card' : `${seg.n} ${seg.title}`;
    b.innerHTML = `<i class="fx"></i><span>${k === 0 ? label : label}</span>`;
    b.setAttribute('aria-label', `Jump to ${seg.title}`);
    b.addEventListener('click', () => jumpTo(seg.i));
    b.addEventListener('dblclick', () => { if (PROJECTS.includes(seg)) openProject(seg.id, true); });
    lane.appendChild(b); clipEls.push({el:b, seg:seg.i});
  });
});
// audio waveform across the whole sequence (generated)
(() => {
  const lane = laneWrap.querySelector('[data-track="audio"]');
  let d = '', n = 320; let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { const h = 2 + Math.abs(Math.sin(i/9)) * 6 + rnd() * 5; d += `M${i} ${10-h}V${10+h}`; }
  lane.insertAdjacentHTML('beforeend', `<svg class="wave" viewBox="0 0 ${n} 20" preserveAspectRatio="none"><rect x="0" y="0" width="${n}" height="20" rx="2" fill="#1d3a2f"/><path d="${d}" stroke="var(--t-audio)" stroke-width=".7" fill="none"/></svg>`);
})();

/* ---------- scroll mapping ---------- */
const space = $('#scrollspace');
const isMobile = () => innerWidth <= 820;
function sizeSpace(){ space.style.height = (TOTAL * 11) + 'vh'; }
sizeSpace();
const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
const secFromScroll = () => Math.min(TOTAL - 0.001, Math.max(0, scrollY / maxScroll() * TOTAL));
const scrollFromSec = sec => sec / TOTAL * maxScroll();
const segAt = sec => SEGS.find(s => sec >= s.start && sec < s.start + s.dur) || SEGS[SEGS.length-1];

let curSeg = -1;
function jumpTo(i){
  const s = SEGS[i];
  stopPlay();
  scrollTo({top: scrollFromSec(s.start + (s.kind === 'intro' ? 0 : s.dur * 0.3)), behavior: reduce ? 'auto' : 'smooth'});
}

/* ---------- monitor: canvas placeholder that scrubs with scroll ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d'), screen = $('#screen'), ov = $('#ov');
function fitCanvas(){
  // resizing a canvas wipes it, so only resize when the size really changed
  const r = screen.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
  const tw = Math.max(1, Math.round(r.width * d)), th = Math.max(1, Math.round(r.height * d));
  if (cv.width !== tw || cv.height !== th) { cv.width = tw; cv.height = th; }
  ctx.setTransform(d,0,0,d,0,0);
}
// redraw the current frame immediately (no blank frame in between)
function redraw(){ const sec = secFromScroll(), s = segAt(sec); draw(s, (sec - s.start) / s.dur); }
const stage = document.querySelector('.stage');
function fitScreen(){
  // desktop: the opening reel fills the whole monitor; project clips keep 16:9 inside it
  const wrap = screen.parentElement, r = wrap.getBoundingClientRect();
  if (isMobile()) { screen.style.width = ''; screen.style.height = ''; }
  else {
    const cs = getComputedStyle(wrap);
    const w = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (stage.classList.contains('intro-wide')) { screen.style.width = w + 'px'; screen.style.height = h + 'px'; }
    else { const sw = Math.min(w, h * 16/9); screen.style.width = sw + 'px'; screen.style.height = (sw * 9/16) + 'px'; }
  }
  fitCanvas();
}
const SHAPES = ['circle','square','tri','bars','circle','square','grid','circle','bars'];
const SOLID_BG = '#B23A2F';
// drawn arrow: the ↗ character turns into a colour emoji on iPhones
const PLAY = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5l10 5.5-10 5.5z"/></svg>';
const NEXT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';
const ARR = '<svg class="arr" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 11L11 5M6 5h5v5"/></svg>';
const PLACEHOLDER_COLORS = ['#3A4A6B','#2F5C56','#6A3F3A','#4C3F6B','#5A5534','#2E4A5C','#6B4A2E','#3F5A3A','#5B3651'];   // intro + end card: one solid colour inside the 16:9 frame
const IMG = {};
function getImg(src){ if (!IMG[src]) { const i = new Image(); i.onload = () => req(); i.src = src; IMG[src] = i; } return IMG[src]; }
SEGS.forEach(s => (s.imgs || []).forEach(getImg));
function drawImgs(seg, t, w, h){
  if (seg.seq) {
    // film frames: the playhead picks the frame, so scrolling or dragging plays the clip; nearest loaded frame shows while others load
    const n = seg.imgs.length; let k = Math.min(n - 1, Math.floor(t * n)), im = getImg(seg.imgs[k]);
    while ((!im.complete || !im.naturalWidth) && k > 0) im = getImg(seg.imgs[--k]);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
    if (!im.complete || !im.naturalWidth) return;
    const cs = Math.max(w / im.naturalWidth, h / im.naturalHeight);
    ctx.drawImage(im, (w - im.naturalWidth * cs) / 2, (h - im.naturalHeight * cs) / 2, im.naturalWidth * cs, im.naturalHeight * cs);
    return;
  }
  // real content: the clip steps through its images as you scroll, each with a scroll-driven push-in
  const n = seg.imgs.length, k = Math.min(n - 1, Math.floor(t * n)), lt = t * n - k, im = getImg(seg.imgs[k]);
  ctx.fillStyle = '#1A1C1F'; ctx.fillRect(0,0,w,h);
  if (!im.complete || !im.naturalWidth) return;
  // crop to fill the 16:9 monitor (no blurred backdrop); slow push-in and vertical drift stay inside the crop
  const iw0 = im.naturalWidth, ih0 = im.naturalHeight;
  const cs = Math.max(w/iw0, h/ih0) * (1 + 0.08 * lt), iw = iw0*cs, ih = ih0*cs;
  ctx.drawImage(im, (w - iw)/2, (h - ih) * (0.35 + 0.3 * lt), iw, ih);
}
function draw(seg, t){
  const w = cv.width / (cv.width / screen.clientWidth || 1), h = screen.clientHeight;
  ctx.clearRect(0,0,w,h);
  if (seg.kind === 'intro') return;   // the showreel video shows through the cleared canvas
  if (seg.imgs) return drawImgs(seg, t, w, h);
  if (seg.kind === 'intro' || seg.kind === 'end') { ctx.fillStyle = SOLID_BG; ctx.fillRect(0,0,w,h); return; }
  // placeholder: one solid colour per clip until the real footage arrives (scrub, frame counter and open-project still work)
  ctx.fillStyle = PLACEHOLDER_COLORS[seg.i % PLACEHOLDER_COLORS.length];
  ctx.fillRect(0,0,w,h);
}

function overlayFor(seg){
  if (seg.kind === 'intro') return `
    <div class="ov-top mono"><span></span><span id="fr"></span></div>
    <div class="intro-card" id="introT">
      <p class="intro-pre">Raul Muñoz presents</p>
      <h1 class="intro-title">Creative Director<br>who still makes<br>the work.</h1>
      <button type="button" class="chip-btn intro-cta" data-act="skip">View work →</button>
      <div class="m-actions"><button type="button" class="m-btn primary" data-act="skip">${PLAY}View work</button><button type="button" class="m-btn" data-act="about">About</button></div>
    </div>
    `;
  if (seg.kind === 'end') return `
    <div class="ov-top mono"><span>END CARD</span><span id="fr"></span></div>
    <div class="ov-mid"><h2 class="ov-title">That's a wrap.</h2><p class="ov-sub">Want the full timeline, the archive, or a conversation?</p></div>
    <div class="ov-bottom"><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="chip-btn" data-act="contact">Contact</button>
      <button type="button" class="chip-btn ghost" data-act="about">Full career timeline</button>
      <button type="button" class="chip-btn ghost" data-act="bin">All work &amp; archive</button></div>
      <button type="button" class="chip-btn ghost" data-act="restart">↺ Back to start</button></div>
    <div class="m-actions" style="margin-top:0"><button type="button" class="m-btn primary" data-act="contact">Contact</button><button type="button" class="m-btn" data-act="restart">Back to start</button></div>`;
  return `
    <div class="ov-top mono"><span></span><span id="fr"></span></div>
    <div class="ov-mid"><p class="m-eyebrow">Clip ${seg.n} · ${TC[seg.tracks[0]].name}</p><h2 class="ov-title" style="font-size:min(6.4cqw,12cqh)">${seg.title}</h2>
      <p class="ov-meta">${[seg.client, seg.year, seg.role, seg.markets].filter(x => x && x !== '—').join('<i>•</i>')}</p>
      <p class="ov-sub">${seg.line}</p>
      <div class="ov-actions"><button type="button" class="chip-btn ov-cta" data-act="open">${PLAY}Open project</button><button type="button" class="ov-btn2" data-act="next">Next clip</button></div>
      <div class="m-actions"><button type="button" class="m-btn primary" data-act="open">${PLAY}Open project</button><button type="button" class="m-btn" data-act="next">Next clip${NEXT}</button></div></div>
    <div class="ov-bottom ov-badges">${seg.tracks.map(t => `<span class="ov-badge"><i style="background:${TC[t].c}"></i>${TC[t].name}</span>`).join('')}</div>`;
}
ov.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  e.stopPropagation();
  const act = a.dataset.act, seg = SEGS[curSeg];
  if (act === 'skip') jumpTo(1);
  else if (act === 'next') navStep(1);
  else if (act === 'open') openProject(seg.id, true);
  else if (act === 'restart') { stopPlay(); scrollTo({top:0, behavior: reduce?'auto':'smooth'}); }
  else if (act === 'contact') openAbout(true);
  else if (act === 'about') openAbout(false);
  else if (act === 'bin') openBin();
});
screen.addEventListener('click', e => { if (e.target.closest('[data-act]')) return; const s = SEGS[curSeg]; if (PROJECTS.includes(s)) openProject(s.id, true); });

function inspectorFor(seg){
  if (seg.kind === 'intro' || seg.kind === 'end') return `

  ['cd',2017.2,2018.8,'Fox Sports Australia','Digital Creative Director · Sydney','Campaigns, social, platform experiences'],
  ['ux',2018.8,2026.9,'Freelance','Digital CD · UX/UI · remote','Web and mobile products'],
  ['ad',2019.6,2021.1,'Gelato','In-house Art Director · Oslo','Brand & marketing, photo/film'],
  ['cd',2021.1,2026.9,'NutraQ / VitaeLab','Creative Director · Oslo','Brand, campaigns, TV, digital, social']
];
const AWARDS = [[2010.88,'IAB ×2'],[2010.95,'ACHAP Grand Prix'],[2011.38,'McCann best of region'],[2011.6,'AMAUTA Gold + Silver']];
const Y0 = 2006, Y1 = 2027, yp = y => ((y - Y0) / (Y1 - Y0) * 100) + '%';
$('#aboutBody').innerHTML = `
  <div class="about-grid">
    <div><p class="eyebrow">Placeholder bio</p><h2>18 years. Four countries. Every medium.</h2>
      <p>Creative Director with experience across in-house, agency and freelance roles in Norway, Australia, Chile and New Zealand. Builds creative platforms and leads integrated work across TV, digital and social, and still makes the work by hand.</p>
      <p class="todo">Final bio copy to be written.</p></div>
    <div><p class="eyebrow">Capabilities</p><div class="caps">
      <div><h4>Direction</h4><p>Creative direction, campaign ideas, art direction, brand</p></div>
      <div><h4>Digital</h4><p>UX, UI, apps, landing pages, digital channel strategy</p></div>
      <div><h4>Moving image</h4><p>Film direction, shooting, editing, animation</p></div>
      <div><h4>Craft</h4><p>Illustration, painting, photography, drone</p></div></div></div>
  </div>
  <div class="career"><p class="eyebrow" style="margin:12px 0 8px">The full timeline · hover or tap a clip</p>
    <div class="career-scroll"><div class="career-inner" id="career">
      <div><div class="c-lab" style="height:26px;border-bottom:1px solid var(--line)"></div>${CAREER_TRACKS.map(t => `<div class="c-lab"><span class="sw" style="background:${t[2]}"></span>${t[1]}</div>`).join('')}</div>
      <div style="position:relative">
        <div class="c-ruler">${Array.from({length:Y1-Y0}, (_,i) => `<i class="tick ${i%2===0?'major':''}" style="left:${yp(Y0+i)}"></i>${i%2===0?`<span class="tick-l" style="left:${yp(Y0+i)}">${Y0+i}</span>`:''}`).join('')}
          ${AWARDS.map(a => `<span class="marker" style="left:${yp(a[0])}" title="${a[1]}">◆</span>`).join('')}</div>
        ${CAREER_TRACKS.map(t => `<div class="c-lane">${JOBS.filter(j => j[0] === t[0]).map(j => `<span class="c-clip" tabindex="0" style="left:${yp(j[1])};width:calc(${yp(j[2]+Y0-j[1])} - 2px);background:${t[2]}" data-tip="<b>${j[3]}</b><br>${j[4]}<br>${Math.floor(j[1])}–${j[2] > 2026 ? 'now' : Math.floor(j[2])}<br><span style='opacity:.7'>${j[5]}</span>">${j[3]}</span>`).join('')}</div>`).join('')}
      </div>
    </div></div>
    <p class="hint mono" style="margin-top:8px">◆ awards: ${AWARDS.map(a => a[1]).join(' · ')}</p>
  </div>
  <div id="contactSec"><p class="eyebrow" style="padding:0 max(16px, env(safe-area-inset-left,0px)); margin:8px 0">Contact</p>
    <div class="contact"><span class="addr" id="addr">lulokoba@gmail.com</span><button type="button" class="chip-btn" id="copyBtn">Copy email</button><span class="chip-btn ghost" style="cursor:default">CV download · later</span></div></div>`;
const career = $('#career'); let tip = null;
const showTip = el => { hideTip(); tip = document.createElement('div'); tip.className = 'c-tip'; tip.innerHTML = el.dataset.tip; career.appendChild(tip);
  const cr = career.getBoundingClientRect(), r = el.getBoundingClientRect();
  tip.style.left = Math.min(cr.width - 250, Math.max(0, r.left - cr.left)) + 'px'; tip.style.top = (r.bottom - cr.top + 6) + 'px'; };
const hideTip = () => { if (tip) { tip.remove(); tip = null; } };
career.addEventListener('mouseover', e => { const c = e.target.closest('.c-clip'); if (c) showTip(c); });
career.addEventListener('mouseout', e => { if (e.target.closest('.c-clip')) hideTip(); });
career.addEventListener('focusin', e => { const c = e.target.closest('.c-clip'); if (c) showTip(c); });
career.addEventListener('focusout', hideTip);
$('#copyBtn').onclick = () => {
  const b = $('#copyBtn');
  const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy email', 1600); };
  try { navigator.clipboard.writeText('lulokoba@gmail.com').then(done, () => selAddr()); } catch(_) { selAddr(); }
};
function selAddr(){ const r = document.createRange(); r.selectNodeContents($('#addr')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
const about = $('#about');
function openAbout(toContact){ stopPlay(); closeDrawers(); about.hidden = false; lock(); about.querySelector('.close').focus({preventScroll:true});
  const body = $('#aboutBody'); if (toContact) setTimeout(() => body.scrollTo({top: $('#contactSec').offsetTop - 20, behavior: reduce?'auto':'smooth'}), 60); else body.scrollTop = 0; }
function closeDrawers(){ bin.hidden = true; about.hidden = true; hideTip(); lock(); }
document.querySelectorAll('.drawer [data-close]').forEach(b => b.addEventListener('click', closeDrawers));
$('#btnWork').onclick = openBin; $('#btnAbout').onclick = () => openAbout(false); $('#btnContact').onclick = () => openAbout(true);

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === 'Escape') {
    if (!lb.hidden) return closeLb();
    if (!view.hidden) return closeProject();
    if (!bin.hidden || !about.hidden) return closeDrawers();
  }
  if (!lb.hidden) { if (e.key === 'ArrowRight') lbGo(1); if (e.key === 'ArrowLeft') lbGo(-1); return; }
  if (anyOpen()) return;
  const k = e.key.toLowerCase();
  if (k === 'l') { e.preventDefault(); $('#tNext').click(); }
  else if (k === 'j') { e.preventDefault(); $('#tPrev').click(); }
  else if (k === 'k' || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); $('#tPlay').click(); }
  else if (e.key === 'Enter' && (e.target === document.body)) { $('#tOpen').click(); }
});

/* ---------- hash routing: each project has its own link ---------- */
function route(){
  const id = location.hash.slice(1);
  const p = PROJECTS.find(x => x.id === id);
  if (p) {
    showProject(p);
    // keep the timeline in sync with the opened project
    const s = SEGS[p.i]; if (segAt(secFromScroll()).i !== s.i) scrollTo(0, scrollFromSec(s.start + s.dur * .3));
  } else { closeLb(); hideProject(); }
}
addEventListener('hashchange', route);

fitScreen(); frame(); route();
})();
</script>
